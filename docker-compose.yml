services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenbin-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/greenbin
      - CLIENT_URL=http://localhost:5000
      - DEPOT_LAT=26.8467
      - DEPOT_LNG=80.9462
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: greenbin-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: greenbin
    volumes:
      - greenbin-mongo-data:/data/db

volumes:
  greenbin-mongo-data:
    driver: local
